<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>放射師國考神器</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;background:#0b0f14;
    display:flex;align-items:center;justify-content:center}
  #boot{width:min(80vw,340px)}
  #cyCard{border-radius:16px;padding:14px 12px 12px;background:rgba(15,19,25,.97);
    border:1px solid #2b3644;box-shadow:0 14px 44px rgba(0,0,0,.55)}
  #cyPct{text-align:center;font-size:14px;color:#dfe7ef;margin-top:6px;letter-spacing:1px}
  #cyPct.fail{color:#ff8a8a;cursor:pointer}
  #cySvg{width:100%;height:auto;display:block}
  #cyTrail,#cyExitTrail{transition:opacity .3s}
  #cyPt{transition:opacity .2s}
</style>
</head>
<body>
<div id="boot">
  <div id="cyCard">
    <svg id="cySvg" viewBox="0 0 336 320" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="cyGlow">
          <stop offset="0%" stop-color="#ffd98a" stop-opacity=".9"/>
          <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="cyImpG">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="35%" stop-color="#ffd27a"/>
          <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="130" cy="160" r="114" fill="none" stroke="#1c2836" stroke-width="2.5"/>
      <path d="M 127 70 A 90 90 0 0 0 127 250" fill="rgba(95,156,247,.055)" stroke="#4f9cf7" stroke-width="2"/>
      <path d="M 133 70 A 90 90 0 0 1 133 250" fill="rgba(95,156,247,.055)" stroke="#4f9cf7" stroke-width="2"/>
      <line x1="130" y1="66" x2="130" y2="254" stroke="#22303f" stroke-width="1" stroke-dasharray="3 4"/>
      <path d="M 130 69 A 91 91 0 0 1 199.7 101.5" fill="none" stroke="#7d8794" stroke-width="2" opacity=".85"/>
      <path d="M 147.7 59.5 A 102 102 0 0 1 188.5 76.4" fill="none" stroke="#4f9cf7" stroke-width="2" opacity=".8"/>
      <path id="cyTrail" fill="none" stroke="#ffb454" stroke-width="2.2" stroke-linecap="round" opacity=".4"/>
      <path id="cyExitTrail" d="M 130 68 C 185 70, 230 91, 296 120"
            fill="none" stroke="#ffb454" stroke-width="2.2" stroke-linecap="round" opacity=".4"/>
      <path id="cyExitPath" d="M 130 68 C 185 70, 230 91, 296 120" fill="none" stroke="none"/>
      <circle cx="296" cy="120" r="15" fill="#141b24" stroke="#c7cfd8" stroke-width="1.6"/>
      <circle cx="296" cy="120" r="9" fill="none" stroke="#7d8794" stroke-width="1.2"/>
      <circle cx="296" cy="120" r="3.5" fill="#ffb454"/>
      <circle id="cyImp" cx="296" cy="120" r="10" fill="url(#cyImpG)" opacity="0"/>
      <circle id="cyRing" cx="296" cy="120" r="8" fill="none" stroke="#ffd27a" stroke-width="1.6" opacity="0"/>
      <circle id="cyFlashT" cx="130" r="9" fill="#ffe1a0" opacity="0"/>
      <circle id="cyFlashB" cx="130" r="9" fill="#ffe1a0" opacity="0"/>
      <g id="cyPt" opacity="0">
        <circle id="cyPtGlow" r="6" fill="url(#cyGlow)"/>
        <circle id="cyPtCore" r="3" fill="#ffdf9e" stroke="rgba(255,255,255,.55)" stroke-width=".6"/>
      </g>
      <circle cx="130" cy="160" r="2" fill="#3a4a5c"/>
    </svg>
    <div id="cyPct">準備中…</div>
  </div>
</div>

<script>
(function(){
'use strict';
var VER_URL='./version.txt', APP_URL='./app.html', CACHE='shenqi-v2';
var CX=130,CY=160,R0=4,REXIT=92,REV=3.75;
var T_EXIT=160,T_IMPACT=300,MIN_VIEW=600;

function $(id){return document.getElementById(id)}
var pct=$('cyPct'),trail=$('cyTrail'),exitTrail=$('cyExitTrail'),exitPath=$('cyExitPath');
var pt=$('cyPt'),ptGlow=$('cyPtGlow'),ptCore=$('cyPtCore');
var flashT=$('cyFlashT'),flashB=$('cyFlashB'),imp=$('cyImp'),ring=$('cyRing');

(function(){
  var d='M '+CX+' '+CY;
  for(var i=1;i<=300;i++){
    var ph=i/300*REV*2*Math.PI,r=R0+(REXIT-R0)*i/300;
    d+=' L '+(CX+r*Math.cos(ph)).toFixed(1)+' '+(CY+r*Math.sin(ph)).toFixed(1);
  }
  trail.setAttribute('d',d);
})();
var L=trail.getTotalLength(),LE=exitPath.getTotalLength();
trail.style.strokeDasharray=L;trail.style.strokeDashoffset=L;
exitTrail.style.strokeDasharray=LE;exitTrail.style.strokeDashoffset=LE;
var PHI_TOT=REV*2*Math.PI;

/* 動畫:p=0~1 軌跡從中心往外填滿;p=1 射出打靶後進入 */
var pT=0,pS=0,st='run',t0=performance.now(),lastTs=0,tMark=0,flT=0,flB=0,cross=0,entered=false;
function setP(p){pT=Math.max(0,Math.min(1,p))}
function loop(ts){
  var dt=Math.min(50,ts-(lastTs||ts));lastTs=ts;
  if(st==='run'){
    pS+=(pT-pS)*Math.min(1,dt/100);
    if(pT>=1&&pS>.995){pS=1;st='exit';tMark=ts;pt.style.opacity=0;trail.style.opacity=0}
    draw(pS,ts,dt);
  }else if(st==='exit'){
    var q=Math.min(1,(ts-tMark)/T_EXIT);
    var ep=exitPath.getPointAtLength(q*LE);
    pt.style.opacity=1;
    pt.setAttribute('transform','translate('+ep.x.toFixed(1)+' '+ep.y.toFixed(1)+')');
    exitTrail.style.strokeDashoffset=LE*(1-q);
    if(q>=1){st='imp';tMark=ts;pt.style.opacity=0}
  }else if(st==='imp'){
    var q2=Math.min(1,(ts-tMark)/T_IMPACT);
    imp.setAttribute('opacity',Math.max(0,1-q2).toFixed(2));
    imp.setAttribute('r',(10+26*q2).toFixed(1));
    ring.setAttribute('r',(8+26*q2).toFixed(1));
    ring.setAttribute('opacity',(Math.max(0,1-q2)*.85).toFixed(2));
    if(q2>=.4&&!entered){entered=true;go()}
  }
  requestAnimationFrame(loop);
}
function draw(p,ts,dt){
  var phi=p*PHI_TOT,s=p*L;
  var pos=trail.getPointAtLength(s);
  pt.style.opacity=1;
  pt.setAttribute('transform','translate('+pos.x.toFixed(1)+' '+pos.y.toFixed(1)+')');
  ptGlow.setAttribute('r',(6+7*p).toFixed(1));
  ptCore.setAttribute('r',(3+1.4*p).toFixed(2));
  trail.style.strokeDashoffset=Math.max(0,L-s);
  if(phi>Math.PI/2){
    var k=Math.floor((phi-Math.PI/2)/Math.PI);
    if(k>cross){cross=k;
      var r=R0+(REXIT-R0)*p,lower=(phi%(2*Math.PI))<Math.PI;
      if(lower){flB=1;flashB.setAttribute('cy',(CY+r).toFixed(1))}
      else{flT=1;flashT.setAttribute('cy',(CY-r).toFixed(1))}
    }
  }
  flT=Math.max(0,flT-dt/260);flB=Math.max(0,flB-dt/260);
  flashT.setAttribute('opacity',(flT*.9).toFixed(2));
  flashB.setAttribute('opacity',(flB*.9).toFixed(2));
}
requestAnimationFrame(loop);

function go(){
  var wait=Math.max(0,MIN_VIEW-(performance.now()-t0));
  setTimeout(function(){location.replace(APP_URL)},wait);
}
function fail(){
  pct.textContent='載入失敗,點此重試';
  pct.classList.add('fail');
  $('boot').addEventListener('click',function(){location.reload()});
}

/* 主流程 */
async function main(){
  if('serviceWorker' in navigator&&location.protocol==='https:'){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }
  var cache=null;
  try{if(window.caches)cache=await caches.open(CACHE)}catch(e){}
  if(!cache){location.replace(APP_URL);return}   /* 不支援 Cache API:退回舊行為 */

  var remote=null;
  try{remote=(await(await fetch(VER_URL,{cache:'no-store'})).text()).trim()}catch(e){}

  var cachedApp=await cache.match(APP_URL);
  var storedVer='';
  try{if(await cache.match('./ver'))storedVer=(await(await cache.match('./ver')).text()).trim()}catch(e){}

  if(remote===null){                             /* 沒網路 */
    if(cachedApp){pct.textContent='離線模式';setP(1)}else fail();
    return;
  }
  if(cachedApp&&storedVer===remote){             /* 已是最新:直接進 */
    setP(1);return;
  }
  /* 下載神器本體 */
  pct.textContent='連線中…';
  try{
    var res=await fetch(APP_URL,{cache:'no-store',headers:{'x-cy-preload':'1'}});
    if(!res.ok)throw 0;
    var total=+res.headers.get('Content-Length')||0;
    var gzipped=/gzip|br/i.test(res.headers.get('Content-Encoding')||'');
    var got=0,chunks=[];
    pct.textContent='0%';
    if(res.body&&res.body.getReader){
      var reader=res.body.getReader();
      while(true){
        var r=await reader.read();
        if(r.done)break;
        chunks.push(r.value);got+=r.value.length;
        if(total>0&&!gzipped)setP(got/total);                          /* 精確進度 */
        else setP(Math.min(.96,1-Math.exp(-got/2500000)));             /* 壓縮傳輸:估算進度 */
        pct.textContent=Math.round(pT*100)+'%';
      }
    }else{
      chunks=[new Uint8Array(await res.arrayBuffer())];
    }
    setP(1);pct.textContent='100%';
    var blob=new Blob(chunks,{type:'text/html'});
    await cache.put(APP_URL,new Response(blob));
    await cache.put('./ver',new Response(remote));
  }catch(e){fail()}
}
main();
})();
</script>
</body>
</html>
